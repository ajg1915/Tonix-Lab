<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live player · Tonix Lab</title>
<style>
:root{--amber:#ffb340}
html,body{margin:0;height:100%;background:#000}
body{border-top:3px solid var(--amber);box-sizing:border-box}
#player{position:fixed;inset:3px 0 0 0}
#player iframe{width:100%;height:100%;border:0;display:block}
#msg{position:fixed;inset:0;display:grid;place-items:center;padding:16px;margin:0;color:#ff9d92;font:14px system-ui,sans-serif;text-align:center}
</style>
</head><body>
<div id="player"></div>
<p id="msg" hidden></p>
<span id="ttl" hidden></span>
<script src="vdo.js"></script>
<script src="watch.js"></script>
</body></html>
